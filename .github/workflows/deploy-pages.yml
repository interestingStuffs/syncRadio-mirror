name: Build and deploy syncRadio

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror customizations
        uses: actions/checkout@v4
        with:
          path: mirror

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: interestingStuffs/syncRadio
          ref: main
          path: site

      - name: Test upstream
        working-directory: site
        run: node --test

      - name: Apply mirror customizations
        run: |
          cp mirror/config.json site/config.json
          rm -rf site/samples
          cp -a mirror/samples site/samples

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: automatic

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
