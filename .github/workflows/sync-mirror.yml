name: Sync mirror

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Synchronize upstream
        env:
          SYNC_RADIO_SOURCE: /tmp/syncRadio-upstream
        run: |
          git clone --depth 1 https://github.com/interestingStuffs/syncRadio.git /tmp/syncRadio-upstream
          node scripts/sync-mirror.mjs "$SYNC_RADIO_SOURCE" "$GITHUB_WORKSPACE"

      - name: Detect changes
        id: changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit mirror update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "syncRadio mirror"
          git config user.email "sync-radio-mirror@users.noreply.github.com"
          git add -A
          git commit -m "chore: sincronizza contenuti upstream"
          git push
